[project]
name = "meta-dwh"
version = "0.1.0"
description = "Meta DWH: modelo de datos y pipeline para analizar el uso de tablas Iceberg a partir de eventos de Trino"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]